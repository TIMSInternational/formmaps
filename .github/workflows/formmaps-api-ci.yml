name: formmaps-api-ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore services/api/FormMaps.slnx

      - name: Build
        run: dotnet build services/api/FormMaps.slnx --no-restore

      - name: Test
        run: dotnet test services/api/FormMaps.slnx --no-build --verbosity normal

      - name: Build API container
        run: docker build -f services/api/Dockerfile services/api
