name: formmaps-api-ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # ─── GITLEAKS (secret scanning) ─────────────────────────────────────────────
  # formmaps#74. The legacy Node repo has run gitleaks since before this repo
  # existed (formmaps-platform/.github/workflows/ci.yml). Every domain migrated
  # to .NET was therefore moving from a repo where a committed secret gets caught
  # to one where it does not -- and this repo is PUBLIC where that one is private.
  #
  # fetch-depth: 0 is load-bearing, not boilerplate: the monorepo consolidation
  # imported 879 commits of frontend history that have never been scanned here.
  # A shallow clone scans only recent commits and reports a false all-clear.
  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Pinned, with the checksum verified below. Bumping this means bumping the
      # digest too -- get it from
      # https://github.com/gitleaks/gitleaks/releases/download/v<VER>/gitleaks_<VER>_checksums.txt
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # gitleaks-action requires a PAID licence for organization-owned repos and
      # hard-fails without one ("[TIMSInternational] is an organization. License
      # key is required."), which is why this job was red while the legacy repo's
      # identical job passed -- tafurfede is a personal account. The gitleaks
      # BINARY carries no such restriction and is the same scanner, so it needs no
      # licence and no GITHUB_TOKEN. It also drops the action's PR-only scan mode:
      # a full-history scan of this repo costs ~13s, so every run scans everything.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Reads .gitleaks.toml from the repo root automatically. --redact keeps a
      # real finding's value out of the public log; the finding itself is still
      # reported with file, commit and rule.
      - name: Run gitleaks
        run: gitleaks git --redact --no-banner .

  build-test:
    runs-on: ubuntu-latest
    # formmaps#36. The Test step runs the WHOLE solution including
    # FormMaps.IntegrationTests (Testcontainers). The last fully successful run
    # took 50m44s on 2026-07-31; Domains 9a and 10 have since added 170
    # integration tests, and runs now exceed an hour without completing.
    # Without this, GitHub's 6-hour default applies and a stuck run occupies a
    # runner for the rest of the afternoon before reporting anything useful.
    # This does not fix the underlying runtime problem -- it makes it fail with
    # a signal instead of silently. Lower it once #36 lands a real budget.
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore services/api/FormMaps.slnx

      - name: Build
        run: dotnet build services/api/FormMaps.slnx --no-restore

      # Integration tests moved to the sharded `integration` job below (#36).
      # This step keeps the fast, deterministic suites on the critical path so a
      # compile-level or logic-level break is reported in ~2 minutes rather than
      # waiting on Testcontainers.
      - name: Test (unit + contract)
        run: >-
          dotnet test services/api/FormMaps.slnx --no-build --verbosity normal
          --filter "FullyQualifiedName!~FormMaps.IntegrationTests"

      - name: Build API container
        run: docker build -f services/api/Dockerfile services/api

  # ─── INTEGRATION TESTS, SHARDED ─────────────────────────────────────────────
  # formmaps#36. The suite is 2,368 Testcontainers-backed tests at ~1.30s each,
  # so a single run costs ~51 minutes -- which matches the last fully successful
  # CI run exactly (50m44s, 2026-07-31). It is not a hang; it is linear cost that
  # outgrew the budget when Domains 9a and 10 added 170 tests.
  #
  # Splitting by top-level namespace turns ~51 minutes of wall-clock into ~6
  # parallel jobs of roughly 400 tests each (~9 min + build). Shards are balanced
  # by measured test count, listed explicitly rather than globbed so that a NEW
  # namespace fails the coverage check below instead of being silently skipped.
  integration:
    name: Integration (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: assessments
            filter: "FullyQualifiedName~FormMaps.IntegrationTests.Assessments."
          - name: auth-counselor-students
            filter: "FullyQualifiedName~FormMaps.IntegrationTests.Auth.|FullyQualifiedName~FormMaps.IntegrationTests.Counselor.|FullyQualifiedName~FormMaps.IntegrationTests.SchoolStudents."
          - name: messaging-college-plan
            filter: "FullyQualifiedName~FormMaps.IntegrationTests.Messaging.|FullyQualifiedName~FormMaps.IntegrationTests.StudentCoursePlan.|FullyQualifiedName~FormMaps.IntegrationTests.College.|FullyQualifiedName~FormMaps.IntegrationTests.SchoolAdmin."
          - name: school-courses-users-calendar
            filter: "FullyQualifiedName~FormMaps.IntegrationTests.SchoolCourses.|FullyQualifiedName~FormMaps.IntegrationTests.Resumes.|FullyQualifiedName~FormMaps.IntegrationTests.SchoolUsers.|FullyQualifiedName~FormMaps.IntegrationTests.StudentApplicationSubResources.|FullyQualifiedName~FormMaps.IntegrationTests.Calendar.|FullyQualifiedName~FormMaps.IntegrationTests.DataMappings."
          - name: reports-billing-video
            filter: "FullyQualifiedName~FormMaps.IntegrationTests.Prerequisites.|FullyQualifiedName~FormMaps.IntegrationTests.Reports.|FullyQualifiedName~FormMaps.IntegrationTests.CourseImport.|FullyQualifiedName~FormMaps.IntegrationTests.SchoolProfile.|FullyQualifiedName~FormMaps.IntegrationTests.CurriculumFrameworks.|FullyQualifiedName~FormMaps.IntegrationTests.Billing.|FullyQualifiedName~FormMaps.IntegrationTests.Video.|FullyQualifiedName~FormMaps.IntegrationTests.SchoolReads.|FullyQualifiedName~FormMaps.IntegrationTests.ParentPortal.|FullyQualifiedName~FormMaps.IntegrationTests.SchoolAnalytics."
          - name: remainder
            filter: "FullyQualifiedName~FormMaps.IntegrationTests.AcademicGaps.|FullyQualifiedName~FormMaps.IntegrationTests.StudentApplications.|FullyQualifiedName~FormMaps.IntegrationTests.IsamsWrites.|FullyQualifiedName~FormMaps.IntegrationTests.StudentPortfolio.|FullyQualifiedName~FormMaps.IntegrationTests.IsamsReads.|FullyQualifiedName~FormMaps.IntegrationTests.StudentParents.|FullyQualifiedName~FormMaps.IntegrationTests.Uploads.|FullyQualifiedName~FormMaps.IntegrationTests.CommunityService.|FullyQualifiedName~FormMaps.IntegrationTests.ParentChildReads.|FullyQualifiedName~FormMaps.IntegrationTests.Gradebook.|FullyQualifiedName~FormMaps.IntegrationTests.Security.|FullyQualifiedName~FormMaps.IntegrationTests.DbRole.|FullyQualifiedName~FormMaps.IntegrationTests.Data.|FullyQualifiedName~FormMaps.IntegrationTests.Pathways.|FullyQualifiedName~FormMaps.IntegrationTests.ScaffoldTests|FullyQualifiedName~FormMaps.IntegrationTests.TestSupport."

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore services/api/FormMaps.slnx

      - name: Build
        run: dotnet build services/api/FormMaps.slnx --no-restore

      - name: Test (${{ matrix.shard.name }})
        run: >-
          dotnet test services/api/tests/FormMaps.IntegrationTests --no-build --verbosity normal
          --filter "${{ matrix.shard.filter }}"

  # Guards the explicit shard list above. Every test must land in exactly one
  # shard; a namespace added without updating the matrix would otherwise run
  # nowhere and look green. Compares the total discovered count against the sum
  # actually selected by the shard filters.
  integration-coverage:
    name: Integration shard coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build services/api/tests/FormMaps.IntegrationTests

      - name: Every integration test belongs to exactly one shard
        run: |
          set -euo pipefail
          cd services/api
          # Kept off a pipeline into `> /tmp/ns.txt` on purpose. Under pipefail a
          # grep that matches nothing exits 1 and kills the step with an opaque
          # "exit code 1" -- indistinguishable from a real coverage failure. A
          # discovery format change must fail LOUDLY and say so, because a silent
          # empty ns.txt would make this whole guard pass vacuously.
          discovered=$(dotnet test tests/FormMaps.IntegrationTests --list-tests --no-build --nologo -v q)
          printf '%s\n' "$discovered" \
            | grep -oE "FormMaps\.IntegrationTests\.[A-Za-z0-9_]+\." | sort -u > /tmp/ns.txt || true
          if [ ! -s /tmp/ns.txt ]; then
            echo "::error::Discovered ZERO integration namespaces. --list-tests output no longer"
            echo "::error::matches the expected format, so this guard is not checking anything."
            printf '%s\n' "$discovered" | tail -20
            exit 1
          fi
          # Namespaces named in the matrix above. EVERY line needs its trailing
          # dot: ns.txt is built by a regex ending in `\.`, so an entry without one
          # can never match and gets reported as uncovered. That was the whole bug
          # here -- ScaffoldTests (UnitTest1.cs) is a class sitting directly in the
          # FormMaps.IntegrationTests namespace rather than in a sub-namespace, so
          # it got written without the dot. The remainder shard's `~` filter is a
          # substring match, so the test really was running all along.
          cat > /tmp/sharded.txt <<'NS'
          FormMaps.IntegrationTests.Assessments.
          FormMaps.IntegrationTests.Auth.
          FormMaps.IntegrationTests.Counselor.
          FormMaps.IntegrationTests.SchoolStudents.
          FormMaps.IntegrationTests.Messaging.
          FormMaps.IntegrationTests.StudentCoursePlan.
          FormMaps.IntegrationTests.College.
          FormMaps.IntegrationTests.SchoolAdmin.
          FormMaps.IntegrationTests.SchoolCourses.
          FormMaps.IntegrationTests.Resumes.
          FormMaps.IntegrationTests.SchoolUsers.
          FormMaps.IntegrationTests.StudentApplicationSubResources.
          FormMaps.IntegrationTests.Calendar.
          FormMaps.IntegrationTests.DataMappings.
          FormMaps.IntegrationTests.Prerequisites.
          FormMaps.IntegrationTests.Reports.
          FormMaps.IntegrationTests.CourseImport.
          FormMaps.IntegrationTests.SchoolProfile.
          FormMaps.IntegrationTests.CurriculumFrameworks.
          FormMaps.IntegrationTests.Billing.
          FormMaps.IntegrationTests.Video.
          FormMaps.IntegrationTests.SchoolReads.
          FormMaps.IntegrationTests.ParentPortal.
          FormMaps.IntegrationTests.SchoolAnalytics.
          FormMaps.IntegrationTests.AcademicGaps.
          FormMaps.IntegrationTests.StudentApplications.
          FormMaps.IntegrationTests.IsamsWrites.
          FormMaps.IntegrationTests.StudentPortfolio.
          FormMaps.IntegrationTests.IsamsReads.
          FormMaps.IntegrationTests.StudentParents.
          FormMaps.IntegrationTests.Uploads.
          FormMaps.IntegrationTests.CommunityService.
          FormMaps.IntegrationTests.ParentChildReads.
          FormMaps.IntegrationTests.Gradebook.
          FormMaps.IntegrationTests.Security.
          FormMaps.IntegrationTests.DbRole.
          FormMaps.IntegrationTests.Data.
          FormMaps.IntegrationTests.Pathways.
          FormMaps.IntegrationTests.ScaffoldTests.
          FormMaps.IntegrationTests.TestSupport.
          NS
          sed -i 's/^[[:space:]]*//' /tmp/sharded.txt
          sort -u -o /tmp/sharded.txt /tmp/sharded.txt
          if ! missing=$(comm -23 /tmp/ns.txt /tmp/sharded.txt) || [ -n "$missing" ]; then
            echo "::error::These integration namespaces are in no shard and would never run:"
            echo "$missing"
            exit 1
          fi
          echo "All $(wc -l < /tmp/ns.txt) integration namespaces are covered by a shard."

  # ─── FRONTEND (apps/web) ────────────────────────────────────────────────────
  # formmaps#96. Until now the only jobs in this repo were the .NET ones above,
  # so apps/web's 786 jest tests never ran in CI at all -- including every #89
  # optimistic-rollback test, which exists precisely to catch the case a human
  # will not click through. The only frontend gate was Vercel's build on push to
  # main, which catches a type error but runs neither jest nor eslint, and
  # reports after the merge rather than before it.
  #
  # Kept separate from build-test rather than bolted onto it: that job routinely
  # runs over an hour on Testcontainers, and a 2-minute frontend break should not
  # queue behind it.
  web:
    name: Frontend (apps/web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      # `next build` (Vercel) already type-checks, but only after a merge to main.
      # This is the same check on the PR, and it is the cheapest of the three.
      - name: Typecheck
        run: npx tsc --noEmit

      # Errors fail the job; warnings do not. The tree is at 0 errors as of #96
      # (three were cleared to introduce this job: two raw <a> tags that should
      # have been next/link, and an eslint-disable naming a rule from a plugin
      # that is not installed -- which is itself an error).
      #
      # Deliberately NOT --max-warnings 0. The 28 remaining warnings are all dead
      # eslint-disable directives, and `eslint --fix` does not delete those lines,
      # it blanks them -- 220 lines of whitespace churn across 23 files. Not worth
      # coupling to this gate; clean them up as those files are touched.
      - name: Lint
        run: npx eslint src

      - name: Test
        run: npx jest --ci
