name: formmaps-api-staging-deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  BOOTSTRAP_STACK_NAME: formmaps-api-staging-bootstrap
  SERVICE_STACK_NAME: formmaps-api-staging
  SERVICE_NAME: formmaps-api-staging

jobs:
  deploy:
    name: Deploy staging API
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test API
        run: npm run api:test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/formmaps-github-deploy-staging

      - name: Read bootstrap outputs
        id: bootstrap
        run: |
          set -euo pipefail
          ECR_REPOSITORY_URI="$(aws cloudformation describe-stacks \
            --stack-name "$BOOTSTRAP_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='EcrRepositoryUri'].OutputValue | [0]" \
            --output text)"
          ECR_ACCESS_ROLE_ARN="$(aws cloudformation describe-stacks \
            --stack-name "$BOOTSTRAP_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='AppRunnerEcrAccessRoleArn'].OutputValue | [0]" \
            --output text)"
          if [ -z "$ECR_REPOSITORY_URI" ] || [ "$ECR_REPOSITORY_URI" = "None" ]; then
            echo "Missing EcrRepositoryUri output from $BOOTSTRAP_STACK_NAME" >&2
            exit 1
          fi
          if [ -z "$ECR_ACCESS_ROLE_ARN" ] || [ "$ECR_ACCESS_ROLE_ARN" = "None" ]; then
            echo "Missing AppRunnerEcrAccessRoleArn output from $BOOTSTRAP_STACK_NAME" >&2
            exit 1
          fi
          ECR_REGISTRY="${ECR_REPOSITORY_URI%/*}"
          {
            echo "ecr_repository_uri=$ECR_REPOSITORY_URI"
            echo "ecr_registry=$ECR_REGISTRY"
            echo "ecr_access_role_arn=$ECR_ACCESS_ROLE_ARN"
          } >> "$GITHUB_OUTPUT"

      - name: Login to ECR
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${{ steps.bootstrap.outputs.ecr_registry }}"

      - name: Build and push API image
        id: image
        run: |
          set -euo pipefail
          IMAGE_TAG="staging-${GITHUB_SHA}"
          IMAGE_URI="${{ steps.bootstrap.outputs.ecr_repository_uri }}:${IMAGE_TAG}"
          docker build -f services/api/Dockerfile -t "$IMAGE_URI" services/api
          docker tag "$IMAGE_URI" "${{ steps.bootstrap.outputs.ecr_repository_uri }}:staging-latest"
          docker push "$IMAGE_URI"
          docker push "${{ steps.bootstrap.outputs.ecr_repository_uri }}:staging-latest"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Deploy App Runner service stack
        env:
          JWT_SECRET_ARN: ${{ secrets.FORMMAPS_STAGING_JWT_SECRET_ARN }}
          DATABASE_URL_SECRET_ARN: ${{ secrets.FORMMAPS_STAGING_DATABASE_URL_SECRET_ARN }}
          DAILY_API_KEY_SECRET_ARN: ${{ secrets.FORMMAPS_STAGING_DAILY_API_KEY_SECRET_ARN }}
          STAGING_WEB_ORIGIN: ${{ vars.FORMMAPS_STAGING_WEB_ORIGIN }}
          # Added 2026-08-15. The template has required these since 45729997 (2026-08-02) but this
          # step never passed them, so every dispatch since has died in CreateChangeSet with
          # "Parameters: [StripeSecretKeyArn, StripeWebhookSecretArn] must have values" — a failure
          # that only appears AFTER the test suite and image push have already run.
          STRIPE_SECRET_KEY_ARN: ${{ secrets.FORMMAPS_STAGING_STRIPE_SECRET_KEY_ARN }}
          STRIPE_WEBHOOK_SECRET_ARN: ${{ secrets.FORMMAPS_STAGING_STRIPE_WEBHOOK_SECRET_ARN }}
        run: |
          set -euo pipefail
          : "${JWT_SECRET_ARN:?Set FORMMAPS_STAGING_JWT_SECRET_ARN in the staging environment.}"
          : "${DATABASE_URL_SECRET_ARN:?Set FORMMAPS_STAGING_DATABASE_URL_SECRET_ARN in the staging environment.}"
          : "${DAILY_API_KEY_SECRET_ARN:?Set FORMMAPS_STAGING_DAILY_API_KEY_SECRET_ARN in the staging environment.}"
          : "${STAGING_WEB_ORIGIN:?Set FORMMAPS_STAGING_WEB_ORIGIN in the staging environment.}"
          # Guarded like the rest so a missing secret fails here, in seconds, with a name to act on
          # — rather than 40 minutes later inside CloudFormation. Point these at Stripe TEST-mode
          # secrets: the service boots with ASPNETCORE_ENVIRONMENT=Production, so
          # StartupEnvironmentValidator requires them, but staging must never hold the live keys.
          : "${STRIPE_SECRET_KEY_ARN:?Set FORMMAPS_STAGING_STRIPE_SECRET_KEY_ARN in the staging environment (ARN of a Stripe TEST-mode secret key in Secrets Manager, NOT the live nexa/api/STRIPE_SECRET_KEY).}"
          : "${STRIPE_WEBHOOK_SECRET_ARN:?Set FORMMAPS_STAGING_STRIPE_WEBHOOK_SECRET_ARN in the staging environment (ARN of the TEST-mode webhook signing secret).}"
          aws cloudformation deploy \
            --stack-name "$SERVICE_STACK_NAME" \
            --template-file infra/aws/formmaps-api-staging-service.yml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ServiceName="$SERVICE_NAME" \
              ImageIdentifier="${{ steps.image.outputs.image_uri }}" \
              EcrAccessRoleArn="${{ steps.bootstrap.outputs.ecr_access_role_arn }}" \
              JwtSecretArn="$JWT_SECRET_ARN" \
              DatabaseUrlSecretArn="$DATABASE_URL_SECRET_ARN" \
              DailyApiKeySecretArn="$DAILY_API_KEY_SECRET_ARN" \
              StripeSecretKeyArn="$STRIPE_SECRET_KEY_ARN" \
              StripeWebhookSecretArn="$STRIPE_WEBHOOK_SECRET_ARN" \
              StagingWebOrigin="$STAGING_WEB_ORIGIN"

      - name: Read App Runner URL
        id: service
        run: |
          set -euo pipefail
          SERVICE_URL="$(aws cloudformation describe-stacks \
            --stack-name "$SERVICE_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ServiceUrl'].OutputValue | [0]" \
            --output text)"
          if [ -z "$SERVICE_URL" ] || [ "$SERVICE_URL" = "None" ]; then
            echo "Missing ServiceUrl output from $SERVICE_STACK_NAME" >&2
            exit 1
          fi
          echo "base_url=https://$SERVICE_URL" >> "$GITHUB_OUTPUT"

      - name: Run health canary
        env:
          FORMMAPS_STAGING_DOTNET_API_BASE_URL: ${{ steps.service.outputs.base_url }}
        run: npm run api:staging-canary -- --health-only

      # Post-deploy authenticated check. Non-blocking: the deploy + health canary
      # already gate success; this mints a short-lived token in-CI from the JWT
      # secret (no stored/expiring bearer to babysit) and is informational only.
      - name: Run authenticated benchmark canary
        continue-on-error: true
        env:
          FORMMAPS_STAGING_DOTNET_API_BASE_URL: ${{ steps.service.outputs.base_url }}
          JWT_SECRET_ARN: ${{ secrets.FORMMAPS_STAGING_JWT_SECRET_ARN }}
          CANARY_USER_ID: ${{ vars.FORMMAPS_STAGING_CANARY_USER_ID || '00000000-0000-0000-0000-000000000001' }}
          CANARY_SCHOOL_ID: ${{ vars.FORMMAPS_STAGING_CANARY_SCHOOL_ID || '0edde974-5257-4178-b4cf-0006a463d225' }}
        run: |
          set -euo pipefail
          if [ -z "${JWT_SECRET_ARN:-}" ]; then
            echo "Skipping authenticated benchmark canary; FORMMAPS_STAGING_JWT_SECRET_ARN not set."
            exit 0
          fi
          JWT_SECRET="$(aws secretsmanager get-secret-value --secret-id "$JWT_SECRET_ARN" --query SecretString --output text)"
          export FORMMAPS_STAGING_BENCHMARK_BEARER_TOKEN="$(JWT_SECRET="$JWT_SECRET" node -e 'const c=require("crypto"),s=process.env.JWT_SECRET,E=o=>Buffer.from(JSON.stringify(o)).toString("base64url"),n=Math.floor(Date.now()/1000),h=E({alg:"HS256",typ:"JWT"}),p=E({sub:process.env.CANARY_USER_ID,role:"school_admin",schoolId:process.env.CANARY_SCHOOL_ID,permissions:["analytics:school"],iss:"formmaps-api",aud:"formmaps-frontend",iat:n,exp:n+300});process.stdout.write(h+"."+p+"."+c.createHmac("sha256",s).update(h+"."+p).digest("base64url"))')"
          npm run api:staging-canary
