AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  App Runner service for the FormMaps .NET API PRODUCTION deployment.
  Deployed DARK: it serves the full .NET API but no prod traffic reaches it
  until the prod Vercel web sets FORMMAPS_DOTNET_API_BASE_URL and a
  FORMMAPS_ROUTE_*_TO_DOTNET flag is flipped. First cutover target =
  the personality domain (dual-write-free). See
  docs/migration/personality-prod-cutover-runbook.md.

  ⚠️ THE ONE DIFFERENCE FROM STAGING THAT MATTERS: DatabaseUrlSecretArn must
  point at a WRITE-CAPABLE prod Aurora role (staging is read-only). The role
  must be able to INSERT/UPDATE the personality tables AND respect the Identity
  RLS GUCs the .NET writer sets (app.current_user_id / app.current_school_id).
  It must NOT be a BYPASSRLS/superuser role. See the Step-0 checklist in the
  runbook for the role + RLS grant SQL.

Parameters:
  ServiceName:
    Type: String
    Default: formmaps-api-prod
    AllowedPattern: "[A-Za-z0-9][A-Za-z0-9-_]{3,39}"
    Description: App Runner service name.
  ImageIdentifier:
    Type: String
    Description: >-
      Full ECR image identifier including tag. Promote the SAME image tag that
      is green on staging (build once, deploy the identical artifact to prod).
  EcrAccessRoleArn:
    Type: String
    Description: IAM role ARN that App Runner uses to pull the private ECR image.
  JwtSecretArn:
    Type: String
    NoEcho: true
    Description: >-
      Full ARN of the Secrets Manager secret holding the PROD JWT_SECRET. MUST
      be the same signing key the prod Node API uses to sign the access_token
      cookie (issuer formmaps-api, audience formmaps-frontend) or every prod
      cookie 401s.
  DatabaseUrlSecretArn:
    Type: String
    NoEcho: true
    Description: >-
      Full ARN of the Secrets Manager secret holding the PROD DATABASE_URL.
      MUST be a WRITE-CAPABLE, RLS-respecting (non-BYPASSRLS) prod Aurora role
      (see runbook Step-0). This is the single security-critical difference
      from the staging stack, whose role is read-only.
  DailyApiKeySecretArn:
    Type: String
    NoEcho: true
    Description: >-
      Full ARN of the Secrets Manager secret containing DAILY_API_KEY (Domain 7a video calling).
  StripeSecretKeyArn:
    Type: String
    NoEcho: true
    Description: >-
      Full ARN of the Secrets Manager secret containing STRIPE_SECRET_KEY
      (Domain 9a billing). REQUIRED: StartupEnvironmentValidator throws in
      Production when this is absent, so the service will not boot without it
      (formmaps#73). Safe to reuse the legacy Node API's existing secret -- same
      Stripe account, and .NET only reads. Today that is
      arn:aws:secretsmanager:us-east-1:747814092517:secret:nexa/api/STRIPE_SECRET_KEY-5uebSE
  StripeWebhookSecretArn:
    Type: String
    NoEcho: true
    Description: >-
      Full ARN of the Secrets Manager secret containing STRIPE_WEBHOOK_SECRET
      (Domain 9a billing). REQUIRED: the service will not boot without it.
      MUST NOT reuse the legacy Node API's webhook secret. Domain 9a's design is
      a SECOND Stripe endpoint pointing at .NET, and Stripe issues a distinct
      signing secret per endpoint -- reusing Node's makes .NET reject every event
      as an invalid signature. Create the endpoint first (formmaps#43), then
      store THAT endpoint's signing secret here.
  ProdWebOrigin:
    Type: String
    Default: https://app.formmaps.com
    Description: >-
      Prod frontend origin allowed by CORS. A mismatch here makes the browser
      block every cross-origin call from the real frontend, which presents as a
      total outage rather than as a config error.

      RESOLVED 2026-08-17. This defaulted to https://app.formmaps.ai, which
      does not exist: `dig app.formmaps.ai` returns NO record (nor does the
      apex, formmaps.ai). app.formmaps.com resolves to 76.76.21.21 (Vercel) and
      serves 200, and the RUNNING production legacy API agrees --
      FRONTEND_BASE_URL=https://app.formmaps.com, with CORS_ORIGINS listing
      formmaps.com / www.formmaps.com / app.formmaps.com and no .ai variant at
      all. So the old default would have CORS-blocked the entire frontend on
      the first prod deploy, and it disagreed with FrontendBaseUrl below, which
      was already correct.

      formmaps-api-prod-deploy.yml still passes this explicitly from the repo
      variable FORMMAPS_PROD_WEB_ORIGIN and refuses to run if it is unset. Keep
      it that way: a correct default is a safety net, not a reason to let a
      CORS origin be decided by whatever a template happened to ship with.
  LegacyJwtIssuer:
    Type: String
    Default: nexa-api
    Description: >-
      Legacy JWT issuer expected by the .NET API. MUST match what the LIVE prod
      Node backend (nexa-api App Runner) actually SIGNS cookies with at runtime —
      it overrides the code default `formmaps-api` to `nexa-api` via its JWT_ISSUER
      env. A mismatch fails issuer validation → every real cookie 401s
      `missing_identity` (2026-07-22 P0). Verify against nexa-api `JWT_ISSUER`
      before deploy.
  LegacyJwtAudience:
    Type: String
    Default: nexa-frontend
    Description: >-
      Legacy JWT audience expected by the .NET API. MUST match the LIVE prod Node
      `JWT_AUDIENCE` runtime value (`nexa-frontend`, which overrides the code
      default `formmaps-frontend`). A mismatch 401s every real cookie
      (2026-07-22 P0).
  FrontendBaseUrl:
    Type: String
    Default: https://app.formmaps.com
    Description: >-
      Public origin of the web app, read by FormMaps.Api as FRONTEND_BASE_URL (link
      building in outbound mail and redirects). Declared here because it was live on
      the service but absent from this template — i.e. the next deploy would have
      silently dropped it. Value matches what is live, so declaring it is a no-op.
  S3Bucket:
    Type: String
    Default: nexa-platform-uploads
    Description: >-
      Uploads bucket, read by FormMaps.Api as S3_BUCKET. Same drift as above: live on
      the service, absent from this template. NOTE staging currently points at this
      SAME bucket, so staging uploads land in the production bucket — tracked
      separately, not changed here.

      Also the bucket the instance role's S3 policy below is scoped to — the two must
      name the same bucket or the service reads an env var it has no access to.
  SesIdentityDomain:
    Type: String
    Default: formmaps.com
    Description: >-
      Verified SES identity the instance role may send as, scoping the SES policy
      below to arn:aws:ses:<region>:<account>:identity/<this>.

      This value is the domain the plan writes out in full for the STAGING policy
      (docs/superpowers/plans/2026-07-27-wave3-infra-gates.md Task 7 Step 2). The prod
      policy was created by patching an existing one in place (Step 1), so the plan
      records prod's ACTIONS but never prints its Resource. CONFIRM against the live
      role before the first deploy:
      `aws iam get-role-policy --role-name formmaps-api-prod-instance --policy-name
      formmaps-prod-ses-send` — if the live policy is scoped to a different identity,
      pass that one rather than widening this to "*".
  LegacyApiBaseUrl:
    Type: String
    Default: https://5t8ch34ijm.us-east-1.awsapprunner.com
    Description: >-
      Origin of the legacy Node API (App Runner service `nexa-api`), read by
      FormMaps.Api as LEGACY_API_BASE_URL. formmaps#144: LegacyApiInsightsTrigger
      POSTs {this}/api/v1/assessment/generate-insights when an assessment leg
      completes; if it is empty the trigger logs an error and returns, so insights
      are never generated. It MUST live here rather than being set with
      `aws apprunner update-service` — this stack owns RuntimeEnvironmentVariables
      as an explicit list, so a manual value is silently reverted on the next deploy.
  HealthCheckPath:
    Type: String
    Default: /health
    Description: App Runner HTTP health check path.
  VpcConnectorArn:
    Type: String
    Default: arn:aws:apprunner:us-east-1:747814092517:vpcconnector/nexa-api-vpc-nat/1/8b8be38b0fa94596a129dd31a9629ae1
    Description: >-
      App Runner VPC connector ARN for egress to the private prod Aurora
      cluster. Defaults to the existing nexa-api-vpc-nat connector (the shared
      VPC/subnets/SG that reach nexa-aurora-enc — the prod cluster the live
      Node API uses). CONFIRM this connector reaches the PROD database before
      deploying. Without VPC egress the API cannot reach the private DB.
  Cpu:
    Type: String
    Default: 0.5 vCPU
    AllowedValues:
      - 0.25 vCPU
      - 0.5 vCPU
      - 1 vCPU
      - 2 vCPU
      - 4 vCPU
    Description: App Runner CPU allocation.
  Memory:
    Type: String
    Default: 1 GB
    AllowedValues:
      - 0.5 GB
      - 1 GB
      - 2 GB
      - 3 GB
      - 4 GB
      - 6 GB
      - 8 GB
      - 10 GB
      - 12 GB
    Description: App Runner memory allocation.

Resources:
  AppRunnerInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ServiceName}-instance
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-formmaps-prod-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref JwtSecretArn
                  - !Ref DatabaseUrlSecretArn
                  - !Ref DailyApiKeySecretArn
                  # This Resource list is an explicit allow-list. Adding a secret to
                  # RuntimeEnvironmentSecrets WITHOUT adding it here makes App Runner
                  # fail to fetch it and the deployment fail -- keep the two in sync.
                  - !Ref StripeSecretKeyArn
                  - !Ref StripeWebhookSecretArn
        # ── Declared drift recovery (Wave 3 tasks 3.1/3.2) ───────────────────
        # The two policies below reproduce, statement for statement, the INLINE
        # policies that were put on this role by hand with `aws iam
        # put-role-policy` and recorded only in
        # docs/superpowers/plans/2026-07-27-wave3-infra-gates.md (Task 6 Step 1
        # and Task 7 Steps 1-2). They were never stack-managed, so a deploy of
        # this template neither reproduced nor removed them: recreating the role
        # from the template alone produced a service that could not upload to S3
        # or send mail, and nothing detected the disagreement.
        #
        # The names deliberately DIFFER from the hand-made ones
        # (formmaps-dotnet-s3-uploads, formmaps-prod-ses-send) so the first
        # deploy is purely additive — a matching name would have CloudFormation
        # overwrite an inline policy it does not own.
        #
        # OPS STEP, AFTER the first successful deploy: the hand-made inline
        # policies are then redundant duplicates. Delete them so the role has
        # exactly one source of truth (a stack deploy cannot do this for you):
        #   aws iam delete-role-policy --role-name formmaps-api-prod-instance \
        #     --policy-name formmaps-dotnet-s3-uploads
        #   aws iam delete-role-policy --role-name formmaps-api-prod-instance \
        #     --policy-name formmaps-prod-ses-send
        # Leaving them in place is safe but keeps the drift the post-deploy
        # drift check in formmaps-api-prod-deploy.yml exists to surface.
        - PolicyName: stack-managed-s3-uploads
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3Uploads
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${S3Bucket}/*
              - Sid: S3List
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${S3Bucket}
        - PolicyName: stack-managed-ses-send
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Both actions, not just SendEmail: attachment-bearing mail goes out
              # through SendRawEmail, which is a separately authorised action.
              - Sid: FormMapsProdSesSend
                Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SesIdentityDomain}
      Tags:
        - Key: Project
          Value: formmaps
        - Key: Environment
          Value: production

  AppRunnerService:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: !Ref ServiceName
      SourceConfiguration:
        AuthenticationConfiguration:
          AccessRoleArn: !Ref EcrAccessRoleArn
        # Prod moves only on an explicit deploy (promote a vetted staging image).
        AutoDeploymentsEnabled: false
        ImageRepository:
          ImageIdentifier: !Ref ImageIdentifier
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: "8080"
            RuntimeEnvironmentVariables:
              - Name: ASPNETCORE_ENVIRONMENT
                Value: Production
              - Name: ASPNETCORE_URLS
                Value: http://+:8080
              - Name: CORS_ORIGINS
                Value: !Ref ProdWebOrigin
              - Name: LegacyJwt__Issuer
                Value: !Ref LegacyJwtIssuer
              - Name: LegacyJwt__Audience
                Value: !Ref LegacyJwtAudience
              - Name: LEGACY_API_BASE_URL
                Value: !Ref LegacyApiBaseUrl
              - Name: FRONTEND_BASE_URL
                Value: !Ref FrontendBaseUrl
              - Name: S3_BUCKET
                Value: !Ref S3Bucket
            RuntimeEnvironmentSecrets:
              - Name: JWT_SECRET
                Value: !Ref JwtSecretArn
              - Name: DATABASE_URL
                Value: !Ref DatabaseUrlSecretArn
              - Name: DAILY_API_KEY
                Value: !Ref DailyApiKeySecretArn
              - Name: STRIPE_SECRET_KEY
                Value: !Ref StripeSecretKeyArn
              - Name: STRIPE_WEBHOOK_SECRET
                Value: !Ref StripeWebhookSecretArn
      InstanceConfiguration:
        Cpu: !Ref Cpu
        Memory: !Ref Memory
        InstanceRoleArn: !GetAtt AppRunnerInstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: !Ref HealthCheckPath
        Interval: 10
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 5
      NetworkConfiguration:
        IngressConfiguration:
          IsPubliclyAccessible: true
        EgressConfiguration:
          EgressType: VPC
          VpcConnectorArn: !Ref VpcConnectorArn
        IpAddressType: IPV4
      Tags:
        - Key: Project
          Value: formmaps
        - Key: Environment
          Value: production

Outputs:
  ServiceArn:
    Description: App Runner service ARN.
    Value: !GetAtt AppRunnerService.ServiceArn
  ServiceId:
    Description: App Runner service ID.
    Value: !GetAtt AppRunnerService.ServiceId
  ServiceUrl:
    Description: >-
      App Runner generated service URL, without protocol. Set
      FORMMAPS_DOTNET_API_BASE_URL=https://<this> on the PROD Vercel project
      (with all FORMMAPS_ROUTE_*_TO_DOTNET flags still off) to deploy the .NET
      API dark, then canary it before flipping any flag.
    Value: !GetAtt AppRunnerService.ServiceUrl
  InstanceRoleArn:
    Description: Runtime instance role ARN.
    Value: !GetAtt AppRunnerInstanceRole.Arn
