AWSTemplateFormatVersion: "2010-09-09"
Description: App Runner service for the FormMaps .NET API staging deployment.

Parameters:
  ServiceName:
    Type: String
    Default: formmaps-api-staging
    AllowedPattern: "[A-Za-z0-9][A-Za-z0-9-_]{3,39}"
    Description: App Runner service name.
  ImageIdentifier:
    Type: String
    Description: Full ECR image identifier, including tag.
  EcrAccessRoleArn:
    Type: String
    Description: IAM role ARN that App Runner uses to pull the private ECR image.
  JwtSecretArn:
    Type: String
    NoEcho: true
    Description: Full ARN of the Secrets Manager secret containing JWT_SECRET.
  DatabaseUrlSecretArn:
    Type: String
    NoEcho: true
    Description: Full ARN of the Secrets Manager secret containing DATABASE_URL.
  DailyApiKeySecretArn:
    Type: String
    NoEcho: true
    Description: >-
      Full ARN of the Secrets Manager secret containing DAILY_API_KEY (Domain 7a video calling).
  StripeSecretKeyArn:
    Type: String
    NoEcho: true
    Description: >-
      Full ARN of the Secrets Manager secret containing STRIPE_SECRET_KEY
      (Domain 9a billing). REQUIRED even on staging: this service runs with
      ASPNETCORE_ENVIRONMENT=Production, so StartupEnvironmentValidator throws
      when it is absent and the service will not boot (formmaps#73).
      Use Stripe TEST-mode keys here, never the live keys prod uses.
  StripeWebhookSecretArn:
    Type: String
    NoEcho: true
    Description: >-
      Full ARN of the Secrets Manager secret containing STRIPE_WEBHOOK_SECRET
      (Domain 9a billing). REQUIRED -- see StripeSecretKeyArn. Must be the
      signing secret of the Stripe endpoint pointing at THIS service, not
      prod's and not the legacy Node API's; Stripe issues a distinct secret per
      endpoint and a mismatched one rejects every event as an invalid signature.
  StagingWebOrigin:
    Type: String
    Default: https://staging.formmaps.ai
    Description: Staging frontend origin allowed by CORS.
  LegacyJwtIssuer:
    Type: String
    Default: formmaps-api
    Description: Legacy JWT issuer expected by the .NET API.
  LegacyJwtAudience:
    Type: String
    Default: formmaps-frontend
    Description: Legacy JWT audience expected by the .NET API.
  S3Bucket:
    Type: String
    Default: nexa-platform-uploads
    Description: >-
      Uploads bucket, read by FormMaps.Api as S3_BUCKET. Declared here because it was
      live on the service but absent from this template — the next deploy would have
      silently dropped it. NOTE this is the SAME bucket prod uses, so staging uploads
      land in the production bucket — tracked separately, not changed here.
  SesFromEmail:
    Type: String
    Default: noreply@formmaps.com
    Description: >-
      From-address for outbound SES mail, read by FormMaps.Api as SES_FROM_EMAIL.
      Live on staging but absent from this template. PROD DELIBERATELY NOT CHANGED in
      the same commit: prod has no SES_FROM_EMAIL at all, and setting it there may turn
      a silent no-send into a thrown error if the prod instance role lacks ses:SendEmail
      — that is being root-caused separately (the two SES traps, formmaps#144-adjacent).
  LegacyApiBaseUrl:
    Type: String
    Default: https://5t8ch34ijm.us-east-1.awsapprunner.com
    Description: >-
      Origin of the legacy Node API (App Runner service `nexa-api`), read by
      FormMaps.Api as LEGACY_API_BASE_URL. formmaps#144: LegacyApiInsightsTrigger
      POSTs {this}/api/v1/assessment/generate-insights when an assessment leg
      completes; if it is empty the trigger logs an error and returns, so insights
      are never generated. It MUST live here rather than being set with
      `aws apprunner update-service` — this stack owns RuntimeEnvironmentVariables
      as an explicit list, so a manual value is silently reverted on the next deploy.
  HealthCheckPath:
    Type: String
    Default: /health
    Description: App Runner HTTP health check path.
  VpcConnectorArn:
    Type: String
    Default: arn:aws:apprunner:us-east-1:747814092517:vpcconnector/nexa-api-vpc-nat/1/8b8be38b0fa94596a129dd31a9629ae1
    Description: >-
      App Runner VPC connector ARN for egress to the private Aurora cluster.
      Defaults to the existing nexa-api-vpc-nat connector (shared VPC/subnets/SG
      that reach nexa-aurora-enc); replace with a dedicated staging connector if
      full isolation is later required. Without VPC egress the API cannot reach
      the private database.
  Cpu:
    Type: String
    Default: 0.5 vCPU
    AllowedValues:
      - 0.25 vCPU
      - 0.5 vCPU
      - 1 vCPU
      - 2 vCPU
      - 4 vCPU
    Description: App Runner CPU allocation.
  Memory:
    Type: String
    Default: 1 GB
    AllowedValues:
      - 0.5 GB
      - 1 GB
      - 2 GB
      - 3 GB
      - 4 GB
      - 6 GB
      - 8 GB
      - 10 GB
      - 12 GB
    Description: App Runner memory allocation.

Resources:
  AppRunnerInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ServiceName}-instance
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-formmaps-staging-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref JwtSecretArn
                  - !Ref DatabaseUrlSecretArn
                  - !Ref DailyApiKeySecretArn
                  # Explicit allow-list. A secret added to RuntimeEnvironmentSecrets
                  # but missing here makes App Runner fail to fetch it and the
                  # deployment fail -- keep the two lists in sync.
                  - !Ref StripeSecretKeyArn
                  - !Ref StripeWebhookSecretArn
      Tags:
        - Key: Project
          Value: formmaps
        - Key: Environment
          Value: staging

  AppRunnerService:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: !Ref ServiceName
      SourceConfiguration:
        AuthenticationConfiguration:
          AccessRoleArn: !Ref EcrAccessRoleArn
        AutoDeploymentsEnabled: false
        ImageRepository:
          ImageIdentifier: !Ref ImageIdentifier
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: "8080"
            RuntimeEnvironmentVariables:
              - Name: ASPNETCORE_ENVIRONMENT
                Value: Production
              - Name: ASPNETCORE_URLS
                Value: http://+:8080
              - Name: CORS_ORIGINS
                Value: !Ref StagingWebOrigin
              - Name: LegacyJwt__Issuer
                Value: !Ref LegacyJwtIssuer
              - Name: LegacyJwt__Audience
                Value: !Ref LegacyJwtAudience
              - Name: LEGACY_API_BASE_URL
                Value: !Ref LegacyApiBaseUrl
              - Name: S3_BUCKET
                Value: !Ref S3Bucket
              - Name: SES_FROM_EMAIL
                Value: !Ref SesFromEmail
            RuntimeEnvironmentSecrets:
              - Name: JWT_SECRET
                Value: !Ref JwtSecretArn
              - Name: DATABASE_URL
                Value: !Ref DatabaseUrlSecretArn
              - Name: DAILY_API_KEY
                Value: !Ref DailyApiKeySecretArn
              - Name: STRIPE_SECRET_KEY
                Value: !Ref StripeSecretKeyArn
              - Name: STRIPE_WEBHOOK_SECRET
                Value: !Ref StripeWebhookSecretArn
      InstanceConfiguration:
        Cpu: !Ref Cpu
        Memory: !Ref Memory
        InstanceRoleArn: !GetAtt AppRunnerInstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: !Ref HealthCheckPath
        Interval: 10
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 5
      NetworkConfiguration:
        IngressConfiguration:
          IsPubliclyAccessible: true
        EgressConfiguration:
          EgressType: VPC
          VpcConnectorArn: !Ref VpcConnectorArn
        IpAddressType: IPV4
      Tags:
        - Key: Project
          Value: formmaps
        - Key: Environment
          Value: staging

Outputs:
  ServiceArn:
    Description: App Runner service ARN.
    Value: !GetAtt AppRunnerService.ServiceArn
  ServiceId:
    Description: App Runner service ID.
    Value: !GetAtt AppRunnerService.ServiceId
  ServiceUrl:
    Description: App Runner generated service URL, without protocol.
    Value: !GetAtt AppRunnerService.ServiceUrl
  InstanceRoleArn:
    Description: Runtime instance role ARN.
    Value: !GetAtt AppRunnerInstanceRole.Arn
