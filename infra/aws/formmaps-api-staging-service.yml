AWSTemplateFormatVersion: "2010-09-09"
Description: App Runner service for the FormMaps .NET API staging deployment.

Parameters:
  ServiceName:
    Type: String
    Default: formmaps-api-staging
    AllowedPattern: "[A-Za-z0-9][A-Za-z0-9-_]{3,39}"
    Description: App Runner service name.
  ImageIdentifier:
    Type: String
    Description: Full ECR image identifier, including tag.
  EcrAccessRoleArn:
    Type: String
    Description: IAM role ARN that App Runner uses to pull the private ECR image.
  JwtSecretArn:
    Type: String
    NoEcho: true
    Description: Full ARN of the Secrets Manager secret containing JWT_SECRET.
  DatabaseUrlSecretArn:
    Type: String
    NoEcho: true
    Description: Full ARN of the Secrets Manager secret containing DATABASE_URL.
  StagingWebOrigin:
    Type: String
    Default: https://staging.formmaps.ai
    Description: Staging frontend origin allowed by CORS.
  LegacyJwtIssuer:
    Type: String
    Default: formmaps-api
    Description: Legacy JWT issuer expected by the .NET API.
  LegacyJwtAudience:
    Type: String
    Default: formmaps-frontend
    Description: Legacy JWT audience expected by the .NET API.
  HealthCheckPath:
    Type: String
    Default: /health
    Description: App Runner HTTP health check path.
  Cpu:
    Type: String
    Default: 0.5 vCPU
    AllowedValues:
      - 0.25 vCPU
      - 0.5 vCPU
      - 1 vCPU
      - 2 vCPU
      - 4 vCPU
    Description: App Runner CPU allocation.
  Memory:
    Type: String
    Default: 1 GB
    AllowedValues:
      - 0.5 GB
      - 1 GB
      - 2 GB
      - 3 GB
      - 4 GB
      - 6 GB
      - 8 GB
      - 10 GB
      - 12 GB
    Description: App Runner memory allocation.

Resources:
  AppRunnerInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ServiceName}-instance
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-formmaps-staging-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref JwtSecretArn
                  - !Ref DatabaseUrlSecretArn
      Tags:
        - Key: Project
          Value: formmaps
        - Key: Environment
          Value: staging

  AppRunnerService:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: !Ref ServiceName
      SourceConfiguration:
        AuthenticationConfiguration:
          AccessRoleArn: !Ref EcrAccessRoleArn
        AutoDeploymentsEnabled: false
        ImageRepository:
          ImageIdentifier: !Ref ImageIdentifier
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: "8080"
            RuntimeEnvironmentVariables:
              - Name: ASPNETCORE_ENVIRONMENT
                Value: Production
              - Name: ASPNETCORE_URLS
                Value: http://+:8080
              - Name: CORS_ORIGINS
                Value: !Ref StagingWebOrigin
              - Name: LegacyJwt__Issuer
                Value: !Ref LegacyJwtIssuer
              - Name: LegacyJwt__Audience
                Value: !Ref LegacyJwtAudience
            RuntimeEnvironmentSecrets:
              - Name: JWT_SECRET
                Value: !Ref JwtSecretArn
              - Name: DATABASE_URL
                Value: !Ref DatabaseUrlSecretArn
      InstanceConfiguration:
        Cpu: !Ref Cpu
        Memory: !Ref Memory
        InstanceRoleArn: !GetAtt AppRunnerInstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: !Ref HealthCheckPath
        Interval: 10
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 5
      NetworkConfiguration:
        IngressConfiguration:
          IsPubliclyAccessible: true
        EgressConfiguration:
          EgressType: DEFAULT
        IpAddressType: IPV4
      Tags:
        - Key: Project
          Value: formmaps
        - Key: Environment
          Value: staging

Outputs:
  ServiceArn:
    Description: App Runner service ARN.
    Value: !GetAtt AppRunnerService.ServiceArn
  ServiceId:
    Description: App Runner service ID.
    Value: !GetAtt AppRunnerService.ServiceId
  ServiceUrl:
    Description: App Runner generated service URL, without protocol.
    Value: !GetAtt AppRunnerService.ServiceUrl
  InstanceRoleArn:
    Description: Runtime instance role ARN.
    Value: !GetAtt AppRunnerInstanceRole.Arn
